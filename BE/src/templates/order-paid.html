<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thanh toán thành công – {{appName}}</title>
</head>
<body style="margin:0;padding:24px;background:#F9F9FE;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;">
    <h1 style="margin:0 0 8px;font-size:20px;color:#0070EB;">{{appName}}</h1>
    <p>Xin chào {{userName}},</p>
    <p>Thanh toán thành công. Khóa học đã được mở trong tài khoản của bạn.</p>
    <ul>
      <li>Mã đơn: <strong>{{orderId}}</strong></li>
      <li>Số tiền: <strong>{{amountLabel}}</strong></li>
      <li>Khóa học: {{courseNames}}</li>
    </ul>
    <p>
      <a href="{{actionUrl}}" style="color:#0070EB;font-weight:700;">Vào học ngay</a>
    </p>
    <p style="font-size:12px;color:#888;">© {{year}} {{appName}}</p>
  </div>
</body>
</html>
