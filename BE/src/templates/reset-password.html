<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu – {{appName}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F9F9FE;font-family:Inter,Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F9F9FE;padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background-color:#0070EB;padding:28px 32px;text-align:center;color:#ffffff;">
              <div style="font-size:22px;font-weight:800;">{{appName}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 12px;font-size:16px;color:#111;">Xin chào {{userName}},</p>
              <p style="margin:0 0 20px;font-size:15px;color:#444;line-height:1.6;">
                Bạn vừa yêu cầu đặt lại mật khẩu. Nhấn nút bên dưới để tạo mật khẩu mới.
                Link có hiệu lực một lần và sẽ hết hạn khi bạn đặt lại mật khẩu thành công.
              </p>
              <p style="text-align:center;margin:28px 0;">
                <a href="{{resetUrl}}" style="display:inline-block;background:#0070EB;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:700;">
                  Đặt lại mật khẩu
                </a>
              </p>
              <p style="margin:0;font-size:13px;color:#888;line-height:1.5;">
                Nếu bạn không yêu cầu thao tác này, hãy bỏ qua email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;font-size:12px;color:#999;text-align:center;">
              © {{year}} {{appName}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
