# Full GATS Academy stack: backend API + video worker + web-app + admin-dashboard
# (single image, run by pm2) plus Postgres, Redis and MinIO infrastructure.
#
#   docker compose -p gats-academy up --build -d
#
# Exposed on the host (left = host port; changed to avoid conflicts on the VPS):
#   - Backend API      http://localhost:3000
#   - Web app          http://localhost:3005
#   - Admin dashboard  http://localhost:9100
#   - MinIO console     http://localhost:9011  (minioadmin / minioadmin)
#   - MinIO S3 API      http://localhost:9010

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000" # MinIO S3 API  (host 9010)
      - "9011:9001" # MinIO console (host 9011; 9001 busy on VPS)
    volumes:
      - minio_data:/data

  # One-shot: wait for MinIO, then create the video + file buckets.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 2;
        done;
        mc mb -p local/s3-video-gats || true;
        mc mb -p local/files-gats || true;
        echo 'buckets ready';

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the web-app client bundle at build time (NEXT_PUBLIC_*).
        # Override via .env next to this file or `--build-arg`.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Where the BROWSER reaches the API. On a VPS set this to the public
        # URL, e.g. http://YOUR_VPS_IP:3000 or https://api.your-domain.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    image: gats-academy
    container_name: gats-academy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000" # backend API
      - "3005:3005" # web-app
      - "9100:9000" # admin-dashboard (host 9100; 9000 busy on VPS)
    environment:
      # ── Runtime / server ──────────────────────────────────────────────
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3005,http://127.0.0.1:3005,http://localhost:9100,http://127.0.0.1:9100
      # Google OAuth — backend verifies ID tokens with this client id.
      GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      # Admin/web server-side calls target the API inside this same container.
      BE_API_URL: http://localhost:3000
      # ── Postgres ──────────────────────────────────────────────────────
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # ── Redis ─────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
      REDIS_PORT: "6379"
      # ── JWT ───────────────────────────────────────────────────────────
      JWT_SECRET: dev-secret-change-me-please-min-32-characters
      JWT_EXPIRES_IN: 7d
      # ── Email (dummy; sending will no-op/fail but boot is fine) ────────
      EMAIL_USER: noreply@gats.dev
      EMAIL_PASSWORD: changeme
      # ── Video storage (S3-compatible → local MinIO) ───────────────────
      VIDEO_STORAGE_PROVIDER: s3
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: s3-video-gats
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      # ── MinIO (thumbnails + documents) ────────────────────────────────
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: files-gats
      MINIO_REGION: us-east-1
      MINIO_FORCE_PATH_STYLE: "true"
      # ── Default admin (seeded by dev bootstrap) ───────────────────────
      ADMIN_DEFAULT_EMAIL: admin@gmail.com
      ADMIN_DEFAULT_PASSWORD: admin12345
      # ── Video worker tuning ───────────────────────────────────────────
      VIDEO_WORKER_CONCURRENCY: "1"
      HLS_UPLOAD_CONCURRENCY: "16"
      FFMPEG_X264_PRESET: veryfast

volumes:
  postgres_data:
  redis_data:
  minio_data:
