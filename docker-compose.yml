# GATS Academy — DOCKER DEV: MỘT container chạy toàn bộ.
#
#   docker compose up -d --build     # dựng + chạy
#   docker compose logs -f           # xem log
#   docker compose down              # dừng (giữ dữ liệu)
#   docker compose down -v           # dừng + xoá dữ liệu (DB, S3, Redis)
#
# Trong container có: postgres + redis + rustfs (S3) + be + admin + fe (dev server).
# Chỉ 3 cổng mở ra ngoài:
#   - be API           http://localhost:3000
#   - admin dashboard  http://localhost:3001
#   - fe web           http://localhost:3002
#
# Source được mount từ máy vào container → sửa file là app tự reload.

name: gats

services:
  gats:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gats-dev
    container_name: gats-dev
    restart: unless-stopped
    ports:
      - "3000:3000" # be API
      - "3001:3001" # admin dashboard
      - "3002:3002" # fe web
      # Upload (avatar / media / video) lưu ở S3 trong container. Trình duyệt chỉ
      # xem được file upload nếu S3 cũng mở ra ngoài — bỏ comment 2 dòng dưới:
      # - "9010:9010" # S3 API
      # - "9011:9011" # S3 console (minioadmin / minioadmin)
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Google Login (bỏ trống = nút Google báo chưa cấu hình)
      # fe (Vite) đọc biến PUBLIC_*, admin (Next.js) đọc NEXT_PUBLIC_*
      PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # fe (Vite dev server) gọi be ở localhost:3000 — trình duyệt chạy trên máy.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    volumes:
      # Source — sửa trên máy, container tự reload
      - ./be:/app/be
      - ./admin:/app/admin
      - ./fe:/app/fe
      # node_modules nằm trong volume (không lấy node_modules của máy)
      - be_node_modules:/app/be/node_modules
      - admin_node_modules:/app/admin/node_modules
      - fe_node_modules:/app/fe/node_modules
      # Dữ liệu hạ tầng — giữ giữa các lần chạy
      - pg_data:/var/lib/postgresql/data
      - redis_data:/data/redis
      - s3_data:/data/s3

volumes:
  be_node_modules:
  admin_node_modules:
  fe_node_modules:
  pg_data:
  redis_data:
  s3_data:
