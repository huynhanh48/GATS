# Full GATS Academy stack: backend API + video worker + web-app + admin-dashboard
# (single image, run by pm2) plus Postgres, Redis and MinIO infrastructure.
#
# Local dev (BE on host, infra + worker in Docker):
#   docker compose -p gats-academy --profile dev up -d db redis minio minio-init worker
#
# Full production stack:
#   docker compose -p gats-academy up --build -d
#
# Exposed on the host (left = host port; changed to avoid conflicts on the VPS):
#   - Backend API      http://localhost:3000
#   - Web app          http://localhost:3005
#   - Admin dashboard  http://localhost:9100
#   - MinIO console     http://localhost:9011  (minioadmin / minioadmin)
#   - MinIO S3 API      http://localhost:9010

# Shared BE/runtime env for worker (dev profile) and app.
# Production `app` MUST override NODE_ENV=production below.
x-backend-env: &backend-env
  NODE_ENV: development
  PORT: "3000"
  HOST: 0.0.0.0
  DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379
  REDIS_PORT: "6379"
  JWT_SECRET: dev-secret-change-me-please-min-32-characters
  JWT_EXPIRES_IN: 7d
  EMAIL_USER: noreply@gats.dev
  EMAIL_PASSWORD: changeme
  APP_URL: ${APP_URL:-https://api.gats.vn}
  FRONTEND_URL: ${FRONTEND_URL:-https://gats.vn,https://admin.gats.vn,http://localhost:3005,http://127.0.0.1:3005,http://localhost:9000,http://127.0.0.1:9000,http://localhost:9100,http://127.0.0.1:9100}
  # Must match the Web client ID used by the browser (NEXT_PUBLIC_*).
  # Empty → BE returns "Google Login is not configured".
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-${NEXT_PUBLIC_GOOGLE_CLIENT_ID}}
  VIDEO_STORAGE_PROVIDER: s3
  AWS_REGION: us-east-1
  # In-cluster MinIO for API/worker. Override on VPS with LongVan HTTPS (or any
  # public S3) via .env — browser uploads need HTTPS (see S3_PUBLIC_* below).
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-s3-video-gats}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"
  # Browser-facing endpoint/base for presigned uploads + HLS playback (HTTPS).
  # Example LongVan: https://s3-hn1-r1.longvan.net  and  .../s3-video-gats
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-files-gats}
  MINIO_REGION: us-east-1
  MINIO_FORCE_PATH_STYLE: "true"
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
  ADMIN_DEFAULT_EMAIL: admin@gmail.com
  ADMIN_DEFAULT_PASSWORD: admin12345
  # Bank transfer / Sepay (override via .env on VPS)
  BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
  BANK_NAME: ${BANK_NAME:-VietinBank}
  BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
  SEPAY_API_KEY: ${SEPAY_API_KEY:-}
  VNP_TMN_CODE: ${VNP_TMN_CODE:-}
  VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
  VIDEO_WORKER_CONCURRENCY: "1"
  HLS_UPLOAD_CONCURRENCY: "16"
  FFMPEG_X264_PRESET: veryfast

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432" # for local `npm run dev` on host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379" # for local `npm run dev` on host
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000" # MinIO S3 API  (host 9010)
      - "9011:9001" # MinIO console (host 9011; 9001 busy on VPS)
    volumes:
      - minio_data:/data

  # One-shot: wait for MinIO, then create the video + file buckets.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 2;
        done;
        mc mb -p local/s3-video-gats || true;
        mc mb -p local/files-gats || true;
        echo 'buckets ready';

  # Video transcode worker (BullMQ + ffmpeg). Use for local dev when API runs on host.
  # Start with: docker compose -p gats-academy --profile dev up -d db redis minio minio-init worker
  # Do NOT start this when the `app` service is running — app already runs worker via pm2.
  worker:
    profiles: ["dev"]
    build:
      context: ./BE
      dockerfile: Dockerfile.worker
    image: gats-academy-worker
    container_name: gats-academy-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the web-app client bundle at build time (NEXT_PUBLIC_*).
        # Override via .env next to this file or `--build-arg`.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Where the BROWSER reaches the API (baked at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.gats.vn}
    image: gats-academy
    container_name: gats-academy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000" # backend API
      - "3005:3005" # web-app
      - "9100:9000" # admin-dashboard (host 9100; 9000 busy on VPS)
    environment:
      <<: *backend-env
      # Production gate — do not inherit development from x-backend-env.
      NODE_ENV: production
      # Admin SSR/proxy → API inside the same container (NOT the public URL).
      BE_API_URL: http://localhost:3000
      # Browser sockets / any NEXT_PUBLIC client calls from admin.
      NEXT_PUBLIC_BE_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.gats.vn}
      NEXT_PUBLIC_BE_SOCKET_URL: ${NEXT_PUBLIC_API_URL:-https://api.gats.vn}

volumes:
  postgres_data:
  redis_data:
  minio_data:
