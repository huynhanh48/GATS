# Production-only strict overrides. Always deploy with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Requires root `.env` from `.env.vps.example` so browser/API URLs stay
# https://api.gats.vn (base compose defaults to localhost for local runs).
services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports: []

  redis:
    ports: []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: []

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME is required}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'waiting for minio...'; sleep 2;
        done;
        mc mb -p "local/$$S3_BUCKET" || true;
        mc mb -p "local/$$MINIO_BUCKET_NAME" || true;
        mc anonymous set download "local/$$MINIO_BUCKET_NAME" || true;
        echo 'buckets ready';

  app:
    build:
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?NEXT_PUBLIC_GOOGLE_CLIENT_ID is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EMAIL_USER: ${EMAIL_USER:?EMAIL_USER is required}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?EMAIL_PASSWORD is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      NEXT_PUBLIC_BE_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_BE_SOCKET_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      SEPAY_API_KEY: ${SEPAY_API_KEY:?SEPAY_API_KEY is required}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_PG_ENV: ${SEPAY_PG_ENV:-production}
      SEPAY_PG_ENABLED: ${SEPAY_PG_ENABLED:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-files-gats}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:?ADMIN_DEFAULT_EMAIL is required}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD is required}
      MIGRATION_BASELINE_THROUGH: ${MIGRATION_BASELINE_THROUGH:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      MOBILE_FEATURE_FLAGS: ${MOBILE_FEATURE_FLAGS:-}
      MOBILE_MIN_ANDROID_VERSION: ${MOBILE_MIN_ANDROID_VERSION:-1.0.0}
      MOBILE_MIN_IOS_VERSION: ${MOBILE_MIN_IOS_VERSION:-1.0.0}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      VIAVA_COURSE_GEN_URL: ${VIAVA_COURSE_GEN_URL:-http://127.0.0.1:8000}
      VIAVA_API_KEY: ${VIAVA_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?AZURE_OPENAI_API_KEY is required for Viava}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?AZURE_OPENAI_ENDPOINT is required for Viava}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:?AZURE_OPENAI_DEPLOYMENT is required for Viava}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      AZURE_OPENAI_TRANSCRIBE_API_KEY: ${AZURE_OPENAI_TRANSCRIBE_API_KEY:?AZURE_OPENAI_TRANSCRIBE_API_KEY is required for Viava}
      AZURE_OPENAI_TRANSCRIBE_ENDPOINT: ${AZURE_OPENAI_TRANSCRIBE_ENDPOINT:?AZURE_OPENAI_TRANSCRIBE_ENDPOINT is required for Viava}
      AZURE_TRANSCRIBE_DEPLOYMENT: ${AZURE_TRANSCRIBE_DEPLOYMENT:-gpt-4o-mini-transcribe}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      RAG_WORK_DIR: ${RAG_WORK_DIR:-/app/viava/rag_data}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/gats.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v3.2.0
    profiles: ["cert-renew"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done

volumes:
  certbot_www:
  letsencrypt:
