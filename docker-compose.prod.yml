# GATS Academy — DOCKER PRODUCTION (VPS).
#
#   cp .env.prod.example .env      # rồi điền secret
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app
#
# Gồm: Postgres + Redis + S3 (RustFS) + 1 container `app` chạy be + admin + fe
# bằng pm2 (image build từ Dockerfile, KHÔNG mount source).
# db/redis/s3 KHÔNG mở cổng ra host; chỉ `app` mở 3000 (be), 3001 (admin), 3002 (fe).
#
# TLS/reverse proxy: đặt nginx (hoặc proxy khác) phía trước 3 cổng này.

name: gats-academy

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "3000"
  HOST: 0.0.0.0
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379
  REDIS_PORT: "6379"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRES_IN: 7d
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  EMAIL_USER: ${EMAIL_USER:?EMAIL_USER is required}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD:?EMAIL_PASSWORD is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  VIDEO_STORAGE_PROVIDER: s3
  AWS_REGION: us-east-1
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://s3:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME is required}
  MINIO_REGION: us-east-1
  MINIO_FORCE_PATH_STYLE: "true"
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}
  ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:?ADMIN_DEFAULT_EMAIL is required}
  ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD is required}
  MIGRATION_BASELINE_THROUGH: ${MIGRATION_BASELINE_THROUGH:-}
  BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
  BANK_NAME: ${BANK_NAME:-VietinBank}
  BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
  SEPAY_API_KEY: ${SEPAY_API_KEY:?SEPAY_API_KEY is required}
  SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
  SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
  SEPAY_PG_ENV: ${SEPAY_PG_ENV:-production}
  SEPAY_PG_ENABLED: ${SEPAY_PG_ENABLED:-false}
  VNP_TMN_CODE: ${VNP_TMN_CODE:-}
  VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
  VIDEO_WORKER_CONCURRENCY: "1"
  HLS_UPLOAD_CONCURRENCY: "16"
  FFMPEG_X264_PRESET: veryfast
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  # admin (Next.js) gọi be qua loopback trong cùng container
  BE_API_URL: http://localhost:3000
  NEXT_PUBLIC_BE_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
  NEXT_PUBLIC_BE_SOCKET_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Local dùng RustFS vì image MinIO community đã bị gỡ
  # khỏi Docker Hub; đổi image khác (hoặc trỏ ra LongVan) không cần sửa code.
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      RUSTFS_VOLUMES: /data
    volumes:
      - s3_data:/data

  # One-shot: tạo bucket video + file, mở public-read cho bucket file.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME is required}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1; do echo 'waiting for s3...'; sleep 2; done;
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$S3_BUCKET" || true;
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$MINIO_BUCKET_NAME" || true;
        aws --endpoint-url http://s3:9000 s3api put-bucket-policy --bucket "$$MINIO_BUCKET_NAME" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicRead\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$MINIO_BUCKET_NAME/*\"]}]}";
        echo 'buckets ready';

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* được nhúng vào bundle lúc build → đổi phải build lại.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?NEXT_PUBLIC_GOOGLE_CLIENT_ID is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    image: gats-academy
    container_name: gats-academy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000" # be API
      - "3001:3001" # admin dashboard
      - "3002:3002" # fe web
    environment:
      <<: *backend-env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  s3_data:
