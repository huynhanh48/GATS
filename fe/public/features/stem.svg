<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Grid Tech Patterns -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Circuit nodes and decorative curves -->
  <g opacity="0.25">
    <circle cx="950" cy="200" r="140" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="950" cy="200" r="100" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="950" cy="200" r="60" fill="none" stroke="#a855f7" stroke-width="2" />
    <path d="M 800 200 L 950 200 L 1050 100" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="800" cy="200" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1050" cy="100" r="5" fill="#a855f7" filter="url(#glow)" />
    <path d="M 860 300 L 950 200 L 1100 200" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="860" cy="300" r="4" fill="#60a5fa" />
    <circle cx="1100" cy="200" r="5" fill="#38bdf8" />
  </g>

  <!-- Left Content Info -->
  <g transform="translate(80, 85)">
    <!-- Small Category Pill -->
    <rect width="165" height="30" rx="15" fill="url(#badgeGlow)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GATS STEM HUB</text>
    
    <!-- Big Headline -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Kho Học Liệu &amp; Mô-đun <tspan fill="url(#accent)">STEM AI</tspan>
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Giáo dục STEM thực hành tích hợp Trí tuệ Nhân tạo, Robotics và Tự động hóa chuẩn quốc tế
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 155)">
      <!-- Badge 1 -->
      <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Robotics &amp; AI</text>

      <!-- Badge 2 -->
      <rect x="142" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🌐 IoT &amp; Hardware</text>

      <!-- Badge 3 -->
      <rect x="274" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="288" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔬 Khoa học Tự nhiên</text>
    </g>
  </g>

  <!-- Right Graphic Illustration (Atom/Robotics Concept) -->
  <g transform="translate(950, 200)" filter="url(#glow)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-30)" opacity="0.8" />
    <circle cx="70" cy="-20" r="6" fill="#38bdf8" />
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="#a855f7" stroke-width="2" transform="rotate(30)" opacity="0.8" />
    <circle cx="-65" cy="-24" r="5" fill="#a855f7" />
    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="#34d399" stroke-width="2" transform="rotate(90)" opacity="0.8" />
    <circle cx="0" cy="80" r="5.5" fill="#34d399" />
    <!-- Nucleus Center -->
    <circle cx="0" cy="0" r="18" fill="url(#accent)" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
  </g>
</svg>
