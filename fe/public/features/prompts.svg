<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="promptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="promptAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Terminal Window Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.90" />
    </linearGradient>

    <!-- Pill / Glow Gradient -->
    <linearGradient id="pillGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.15" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="640" fill="url(#promptBg)" />

  <!-- Geometric Tech Grid Pattern -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.5">
    <pattern id="gridLarge" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" />
      <circle cx="0" cy="0" r="2" fill="#38bdf8" />
    </pattern>
    <rect width="1920" height="640" fill="url(#gridLarge)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1400" cy="320" r="280" fill="#4f46e5" opacity="0.18" filter="url(#neonGlow)" />
  <circle cx="1650" cy="180" r="220" fill="#06b6d4" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="400" cy="150" r="240" fill="#3b82f6" opacity="0.10" filter="url(#neonGlow)" />

  <!-- Left Content Info (Chuẩn phong cách GATS Hero Banners) -->
  <g transform="translate(120, 140)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="21" fill="url(#pillGlow)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
      <!-- Terminal Icon inside Pill -->
      <path d="M 22 17 L 30 21 L 22 25 M 34 25 L 42 25" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">
        PROMPT ENGINEERING
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Kho Câu Lệnh &amp; <tspan fill="url(#promptAccent)">Prompt AI</tspan>
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">
      Thư viện Prompt chuẩn hóa AIDA, PAS, CoT tối ưu cho ChatGPT, Claude, Gemini &amp; Midjourney
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1: ChatGPT 4o & Claude -->
      <rect width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="20" r="5" fill="#10b981" />
      <text x="38" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">
        ChatGPT &amp; Claude
      </text>

      <!-- Badge 2: One-Click Copy -->
      <g transform="translate(200, 0)">
        <rect width="170" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <path d="M 22 15 L 22 24 L 28 24 M 26 18 L 32 18 L 32 27 L 26 27 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="40" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">
          Copy Prompt 1-Chạm
        </text>
      </g>

      <!-- Badge 3: Dynamic Variables -->
      <g transform="translate(390, 0)">
        <rect width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="25" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">
          ⚡ Tùy Biến [Biến Số]
        </text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: Interactive AI Terminal & Prompt Engine Window -->
  <g transform="translate(1180, 90)" filter="url(#cardShadow)">
    <!-- Terminal Outer Frame -->
    <rect width="620" height="460" rx="18" fill="url(#termBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Terminal Window Header -->
    <path d="M 0 18 C 0 8 8 0 18 0 L 602 0 C 612 0 620 8 620 18 L 620 54 L 0 54 Z" fill="#0b1120" />
    <line x1="0" y1="54" x2="620" y2="54" stroke="#1e293b" stroke-width="1.5" />

    <!-- macOS Style Window Buttons -->
    <circle cx="28" cy="27" r="6" fill="#ef4444" />
    <circle cx="48" cy="27" r="6" fill="#f59e0b" />
    <circle cx="68" cy="27" r="6" fill="#10b981" />

    <!-- Terminal Title -->
    <text x="310" y="32" fill="#64748b" text-anchor="middle" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
      gats-prompt-engine — bash — 80x24
    </text>

    <!-- Terminal Content Area -->
    <g transform="translate(32, 85)" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <!-- Line 1: System Role / Persona -->
      <text x="0" y="24" font-size="14">
        <tspan fill="#38bdf8" font-weight="700">SYSTEM_ROLE</tspan>
        <tspan fill="#64748b"> = </tspan>
        <tspan fill="#a5f3fc">"Senior AI Growth Strategist &amp; Copywriter"</tspan>
      </text>

      <!-- Line 2: Task Instruction -->
      <text x="0" y="64" font-size="14">
        <tspan fill="#ec4899" font-weight="700">FRAMEWORK</tspan>
        <tspan fill="#64748b">   = </tspan>
        <tspan fill="#fbcfe8">[AIDA, Chain-of-Thought, Zero-Shot]</tspan>
      </text>

      <!-- Card Box Inside Terminal: Prompt Template -->
      <g transform="translate(0, 95)">
        <rect width="556" height="150" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.2" />
        
        <!-- Prompt Content Lines -->
        <text x="20" y="36" fill="#94a3b8" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
          Bạn là một chuyên gia thương mại điện tử. Hãy viết bài giới thiệu cho:
        </text>

        <!-- Variable Pill 1 -->
        <g transform="translate(20, 52)">
          <rect width="145" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
          <text x="10" y="17" fill="#93c5fd" font-size="12" font-weight="700" font-family="monospace">[product_name]</text>
        </g>

        <!-- Variable Pill 2 -->
        <g transform="translate(175, 52)">
          <rect width="155" height="26" rx="6" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1" />
          <text x="10" y="17" fill="#c4b5fd" font-size="12" font-weight="700" font-family="monospace">[target_audience]</text>
        </g>

        <!-- Variable Pill 3 -->
        <g transform="translate(340, 52)">
          <rect width="135" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
          <text x="10" y="17" fill="#6ee7b7" font-size="12" font-weight="700" font-family="monospace">[tone_style]</text>
        </g>

        <!-- Prompt Continuation -->
        <text x="20" y="115" fill="#94a3b8" font-size="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
          Tập trung vào giải quyết nỗi đau và tạo 3 lời kêu gọi hành động (CTA) tỷ lệ cao...
        </text>
      </g>

      <!-- Output Status Bar -->
      <g transform="translate(0, 270)">
        <circle cx="10" cy="15" r="4" fill="#38bdf8" />
        <text x="25" y="20" fill="#38bdf8" font-size="13" font-weight="600">
          AI Status: Ready to Generate (2,450+ Uses)
        </text>

        <!-- Simulated Copy Button -->
        <g transform="translate(420, 0)">
          <rect width="136" height="34" rx="6" fill="#2563eb" />
          <path d="M 18 11 L 18 20 L 24 20 M 22 14 L 28 14 L 28 23 L 22 23 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <text x="34" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
            Copy Prompt
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>

