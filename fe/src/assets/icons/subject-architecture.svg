<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Triangle Ruler (Eke / Set Square) -->
  <path d="M12 52 L12 14 Q12 11 15 13 L51 49 Q53 52 50 52 Z" fill="#FA541C"/>
  <!-- Inner Cutout -->
  <path d="M19 46 L19 26 Q19 24.5 20.5 25.5 L41 46 Z" fill="#F3F6FA"/>

  <!-- Ruler Tick Marks along hypotenuse & edges -->
  <line x1="12" y1="20" x2="16" y2="20" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="26" x2="15" y2="26" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="15" y2="38" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="44" x2="16" y2="44" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <line x1="22" y1="52" x2="22" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="52" x2="28" y2="49" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="52" x2="34" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="40" y1="52" x2="40" y2="49" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="52" x2="46" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Drafting Pencil angled across the ruler -->
  <g transform="rotate(45 33 33)">
    <!-- Pencil Eraser & Band -->
    <rect x="29.5" y="6" width="7" height="4" rx="1.5" fill="#FA541C"/>
    <rect x="29.5" y="10" width="7" height="2" fill="#D9D9D9"/>
    <!-- Pencil Body (Blue) -->
    <path d="M29.5 12 L36.5 12 L36.5 44 L29.5 44 Z" fill="#1890FF"/>
    <line x1="32" y1="12" x2="32" y2="44" stroke="#096DD9" stroke-width="1"/>
    <line x1="34.5" y1="12" x2="34.5" y2="44" stroke="#40A9FF" stroke-width="1"/>
    <!-- Pencil Tip (Orange Wood & Lead) -->
    <path d="M29.5 44 L36.5 44 L33 52 Z" fill="#FFA940"/>
    <path d="M31.8 49.3 L34.2 49.3 L33 52 Z" fill="#1890FF"/>
  </g>
</svg>
