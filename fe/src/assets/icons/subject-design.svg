<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Easel Top Peg -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#FA541C" stroke-width="3" stroke-linecap="round"/>
  <!-- Top Mast Clamp -->
  <rect x="28" y="14" width="8" height="4" rx="1.5" fill="#FA541C"/>
  
  <!-- Easel Legs -->
  <line x1="22" y1="38" x2="14" y2="56" stroke="#FA541C" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="50" y2="56" stroke="#FA541C" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="54" stroke="#D4380D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Canvas Board -->
  <rect x="15" y="17" width="34" height="23" rx="3" fill="#4096FF"/>
  <!-- Canvas Artwork: Sun & Birds -->
  <circle cx="23" cy="23" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <path d="M28 22 Q29.5 20.5 31 22 Q32.5 20.5 34 22" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M37 24 Q38.2 22.8 39.5 24 Q40.8 22.8 42 24" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <!-- Canvas Artwork: Hills / Wave -->
  <path d="M15 34 Q24 28 32 32 Q40 36 49 31 L49 40 L15 40 Z" fill="#FF7A45"/>
  <path d="M22 36 Q28 32 35 34 Q42 36 49 33 L49 40 L22 40 Z" fill="#FA541C"/>

  <!-- Shelf Ledge -->
  <rect x="11" y="38.5" width="42" height="3.5" rx="1.75" fill="#FA541C"/>

  <!-- Paintbrush Across Canvas -->
  <g transform="rotate(35 44 40)">
    <!-- Handle -->
    <path d="M42 22 L45 22 L44.5 44 L42.5 44 Z" fill="#FF7A45"/>
    <!-- Ferrule -->
    <rect x="42" y="44" width="3" height="3.5" fill="#BFBFBF"/>
    <!-- Bristles -->
    <path d="M42 47.5 C42 47.5 41 51 43.5 52.5 C46 51 45 47.5 45 47.5 Z" fill="#1890FF"/>
  </g>
</svg>
