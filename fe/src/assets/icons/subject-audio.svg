<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <g transform="rotate(-40 32 32)">
    <!-- Headstock -->
    <path d="M29 6 C29 4 35 4 35 6 L35 12 L29 12 Z" fill="#FA541C"/>
    <!-- Tuning Pegs -->
    <circle cx="27" cy="7" r="1.2" fill="#1890FF"/>
    <circle cx="27" cy="9.5" r="1.2" fill="#1890FF"/>
    <circle cx="27" cy="12" r="1.2" fill="#1890FF"/>
    <circle cx="37" cy="7" r="1.2" fill="#1890FF"/>
    <circle cx="37" cy="9.5" r="1.2" fill="#1890FF"/>
    <circle cx="37" cy="12" r="1.2" fill="#1890FF"/>

    <!-- Guitar Neck -->
    <rect x="30" y="12" width="4" height="24" fill="#E6F7FF"/>
    <line x1="30" y1="16" x2="34" y2="16" stroke="#1890FF" stroke-width="0.8"/>
    <line x1="30" y1="20" x2="34" y2="20" stroke="#1890FF" stroke-width="0.8"/>
    <line x1="30" y1="24" x2="34" y2="24" stroke="#1890FF" stroke-width="0.8"/>
    <line x1="30" y1="28" x2="34" y2="28" stroke="#1890FF" stroke-width="0.8"/>
    <line x1="30" y1="32" x2="34" y2="32" stroke="#1890FF" stroke-width="0.8"/>

    <!-- Guitar Body (Orange Double-Cutaway) -->
    <path d="M25 34 C24 31 21 31 22 36 C22 40 20 43 19 48 C18 55 24 60 32 60 C40 60 46 55 45 48 C44 43 42 40 42 36 C43 31 40 31 39 34 C37 36 34 36 32 36 C30 36 27 36 25 34 Z" fill="#FA541C"/>

    <!-- Pickguard (White) -->
    <path d="M25 39 C24 43 23 48 26 53 C29 55 35 55 36 50 C36 45 35 40 33 39 Z" fill="#FFFFFF"/>

    <!-- Pickups (Blue) -->
    <rect x="30" y="38" width="4" height="1.8" rx="0.5" fill="#1890FF"/>
    <rect x="30" y="42" width="4" height="1.8" rx="0.5" fill="#1890FF"/>
    <rect x="30" y="46" width="4" height="1.8" rx="0.5" fill="#1890FF"/>

    <!-- Bridge & Volume Knobs -->
    <rect x="29" y="51" width="6" height="2.5" rx="0.8" fill="#1890FF"/>
    <circle cx="35" cy="47" r="1.3" fill="#1890FF"/>
    <circle cx="36" cy="51" r="1.3" fill="#1890FF"/>
  </g>
</svg>
