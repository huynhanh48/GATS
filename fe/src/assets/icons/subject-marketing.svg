  <circle cx="42" cy="22" r="11" fill="#FFFFFF"/>
  <circle cx="42" cy="22" r="7" fill="#FA541C"/>
  <circle cx="42" cy="22" r="3" fill="#FFFFFF"/>

  <!-- Dart / Arrow Hitting Center -->
  <line x1="56" y1="8" x2="44" y2="20" stroke="#FA541C" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Dart Flights -->
  <path d="M53 7 L57 7 L57 11 Z" fill="#FA541C"/>
  <path d="M54 6 L58 10" stroke="#FA541C" stroke-width="1.5" stroke-linecap="round"/>

