# GATS Academy — hạ tầng DEV cho chạy backend trên máy (không chạy Node app).
# Dùng khi muốn `cd be && npm run dev:basic` trên host, KHÔNG dùng cùng lúc với
# docker-compose.yml ở gốc repo (trùng cổng 3000/9010).
#
#   cd be && npm run docker:dev     # = docker compose up -d
#   cd be && npm run docker:down
#
# Env đọc từ ./config/.env.development (xem be/config/.env.example).
# S3 dùng RustFS vì image MinIO community đã bị gỡ khỏi Docker Hub.

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./config/.env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage (RustFS). Cùng API S3, thay cho minio/minio đã bị gỡ.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RUSTFS_VOLUMES: /data
    ports:
      - "${MINIO_API_PORT:-9010}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9011}:9001"  # console
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  redis_data:
  s3_data:
